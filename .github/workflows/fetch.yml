name: Fetch Freebuf RSS

on:
  schedule:
    # 每 10 分钟抓一次（GitHub Actions 最短间隔 5 分钟；高峰期可能顺延几分钟）
    - cron: "*/10 * * * *"
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch feed
        run: node fetch.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- freebuf.json; then
            echo "no change, skip commit"
            exit 0
          fi
          git add freebuf.json
          git commit -m "chore: update freebuf feed $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
